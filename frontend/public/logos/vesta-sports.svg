<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <!-- Left Dynamic Sports Icon Mark -->
  <g transform="translate(20, 20)">
    <!-- Dynamic Track / Court Arc -->
    <path d="M 10 95 C 10 40, 50 15, 95 15" fill="none" stroke="#F5A623" stroke-width="6" stroke-linecap="round" />
    <path d="M 24 95 C 24 55, 55 32, 95 32" fill="none" stroke="#F5A623" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    
    <!-- Stadium / Arena Geometry Pillars -->
    <path d="M 38 100 L 38 52 L 48 42 L 48 100 Z" fill="#F5A623" />
    <path d="M 54 100 L 54 36 L 68 22 L 68 100 Z" fill="currentColor" />
    <path d="M 74 100 L 74 48 L 88 34 L 88 100 Z" fill="#F5A623" />
    
    <!-- Arena base ring -->
    <ellipse cx="60" cy="100" rx="48" ry="12" fill="none" stroke="currentColor" stroke-width="3" />
  </g>

  <!-- Typography Right -->
  <g transform="translate(145, 32)">
    <!-- VESTA -->
    <text x="0" y="38" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="36" letter-spacing="0.05em" fill="currentColor">VESTA</text>
    
    <!-- SPORTS INFRASTRUCTURE -->
    <text x="0" y="74" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="24" letter-spacing="0.04em" fill="#F5A623">SPORTS INFRASTRUCTURE</text>
    
    <!-- PVT LTD -->
    <text x="2" y="98" font-family="'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="0.28em" fill="currentColor" opacity="0.9">PVT LTD</text>
    
    <!-- Divider Line -->
    <line x1="2" y1="110" x2="350" y2="110" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Tagline -->
    <text x="2" y="125" font-family="'Montserrat', 'Inter', sans-serif" font-weight="600" font-size="10" letter-spacing="0.18em" fill="currentColor" opacity="0.75">ARENAS • COURTS • TURFS • ATHLETIC FACILITIES</text>
  </g>
</svg>
