<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="100%">
  <!-- Icon Mark Left -->
  <g transform="translate(20, 15)">
    <!-- Gold Architectural Towers Background/Silhouette -->
    <path d="M 12 120 L 12 85 L 24 74 L 24 120 Z" fill="#F5A623" />
    <path d="M 28 120 L 28 55 L 45 40 L 45 120 Z" fill="#F5A623" />
    
    <!-- Central Skyscraper Outline -->
    <polygon points="50,120 50,28 72,12 94,28 94,120" fill="none" stroke="#F5A623" stroke-width="5" stroke-linejoin="round" />
    <polygon points="53,30 72,16 91,30" fill="#F5A623" fill-opacity="0.25" />

    <!-- Bold Architectural VF Black Monogram -->
    <path d="M 40 125 L 40 46 L 105 46 L 105 60 L 56 60 L 56 82 L 95 82 L 95 96 L 56 96 L 56 125 Z" fill="currentColor" />
    <path d="M 62 125 L 62 104 L 78 104 L 78 125 Z" fill="#F5A623" />
  </g>

  <!-- Typography Right -->
  <g transform="translate(145, 35)">
    <!-- VESTA -->
    <text x="0" y="38" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="36" letter-spacing="0.04em" fill="currentColor">VESTA</text>
    <!-- FUTURE -->
    <text x="1" y="80" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="44" letter-spacing="0.04em" fill="#F5A623">FUTURE</text>
    
    <!-- PROPERTIES PVT LTD -->
    <text x="2" y="104" font-family="'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="0.14em" fill="currentColor">PROPERTIES PVT LTD</text>
  </g>

  <!-- Subtitle Bottom Full Width -->
  <g transform="translate(0, 155)">
    <text x="250" y="12" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="20" letter-spacing="0.28em" fill="currentColor">BUILDERS &amp; DEVELOPERS</text>
  </g>
</svg>
